services:
  web:
    image: node:22
    working_dir: /app
    # Dependencies live in a named volume; sync from the lockfile on every start,
    # then exec the live-reload dev server.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)throw new Error('web returned '+r.status)}).catch(e=>{console.error('web check failed: '+e.message);process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  node_modules:
